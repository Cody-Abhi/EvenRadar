name: EventRadar CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx

      - name: Run FastAPI Microservice Tests
        run: pytest fastapi_app/test_api.py -v

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-key' }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY || 'mock-key' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyDummyKeyForStaticBuildsOnly1234' }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || 'pk.eyJ1IjoiZHVtbXkiLCJhIjoiZHVtbXkifQ.dummy' }}


      - name: Start Next.js Production Server
        run: |
          npm run start &
          npx --yes wait-on -t 30000 http-get://localhost:3000/api/openapi.json

      - name: Run API Edge Cases & Mock Tests
        run: npm run test:edge

